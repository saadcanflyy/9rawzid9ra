<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <!-- rim: lighter top edge, slightly darker bottom edge for depth -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- ── CONTAINER ─────────────────────────────────────────────── -->
  <!-- rx=112 ≈ 22% of 512 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- inner rim overlay for depth (1px inset) -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="110.5"
        fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!--
    GLYPH LAYOUT  (all measurements are stroke-center coordinates)

    Working canvas: x 54–458, y 123–434 (54px padding all sides)
    Stroke weight: 28px throughout (consistent weight)

    LEFT  "9": circle cx=116 cy=185 r=48  → tail from (164,185) down to (164,420)
    RIGHT "9": circle cx=396 cy=185 r=48  → tail from (348,185) down to (348,420)
               (mirrored: tail exits left side of circle)
    "Z"      : spans x 210→302, top y=137, bottom y=420

    Optical alignments:
      Circle top stroke edge = Z top stroke edge = y 123
      Tail bottom stroke edge = Z bottom stroke edge = y 434
      Gap between 9-tail stroke and Z stroke = 18px each side (symmetric)
  -->

  <!-- ── LEFT "9" ──────────────────────────────────────────────── -->
  <!-- Arc starts at rightmost point of circle (164,185), sweeps CCW
       (large-arc=1, sweep=0 → goes UP first), nearly full 360°,
       endpoint (164,185.01) ≈ same start point.
       Tangent at endpoint is (0,+1) = pointing DOWN → seamless tail join. -->
  <path d="M 164,185 A 48,48 0 1,0 164,185.01 L 164,420"
        fill="none" stroke="white" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── "Z" ───────────────────────────────────────────────────── -->
  <!-- Path: top-left → top-right → bottom-left → bottom-right
       Miter join at the two interior corners for sharp angular vertices. -->
  <path d="M 210,137 H 302 L 210,420 H 302"
        fill="none" stroke="white" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="miter"
        stroke-miterlimit="10"/>

  <!-- ── RIGHT "9" (mirrored) ──────────────────────────────────── -->
  <!-- Arc starts at leftmost point of circle (348,185), sweeps CW
       (large-arc=1, sweep=1 → goes DOWN first), nearly full 360°.
       Tangent at endpoint is also (0,+1) = pointing DOWN → seamless tail join. -->
  <path d="M 348,185 A 48,48 0 1,1 348,185.01 L 348,420"
        fill="none" stroke="white" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
